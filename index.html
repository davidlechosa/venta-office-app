<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Venta Office</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --navy:#13284E; --orange:#F26B21; --orange-l:#F58A4B; --cream:#F7F1EA; --ink:#1D2433; --muted:#5B6475; --line:#EADFD1; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--cream); color:var(--ink); font-family:Inter, system-ui, sans-serif; }
  header { background:var(--navy); color:#fff; padding:14px 16px; border-bottom:4px solid var(--orange); }
  header b { letter-spacing:.12em; } header span { color:var(--orange-l); letter-spacing:.12em; font-weight:600; }
  header p { margin:4px 0 0; font-size:13px; color:#d9dee8; }
  .top { display:flex; justify-content:space-between; align-items:center; gap:12px; }
  .switch { display:flex; }
  .switch button { font:600 13px Inter, sans-serif; background:transparent; color:#fff; border:1px solid rgba(255,255,255,.45); padding:6px 14px; cursor:pointer; }
  .switch button:first-child { border-radius:6px 0 0 6px; } .switch button:last-child { border-radius:0 6px 6px 0; border-left:0; }
  .switch button[aria-pressed="true"] { background:var(--orange); border-color:var(--orange); }
  .cmd + .cmd { margin-top:8px; }
  .stage { position:relative; }
  #scene { width:100%; height:62vh; min-height:320px; display:block; }
  .overlay { position:absolute; left:12px; right:12px; top:10px; display:flex; justify-content:space-between; align-items:center; gap:8px; pointer-events:none; }
  .overlay small { background:rgba(255,255,255,.85); padding:5px 9px; border-radius:6px; color:var(--muted); font-size:12px; }
  .overlay button { pointer-events:auto; font:600 13px Inter, sans-serif; background:var(--navy); color:#fff; border:0; border-radius:6px; padding:8px 12px; cursor:pointer; }
  nav { display:grid; grid-template-columns:repeat(4,1fr); gap:8px; padding:12px 16px 0; }
  nav button { font:600 13px Inter, sans-serif; padding:10px 6px; border:1px solid var(--line); background:#fff; color:var(--navy); border-radius:8px; cursor:pointer; }
  nav button[aria-pressed="true"] { border-color:var(--orange); box-shadow:inset 0 -3px 0 var(--orange); }
  nav button.later { color:var(--muted); }
  #card { margin:12px 16px 24px; background:#fff; border:1px solid var(--line); border-left:4px solid var(--orange); border-radius:8px; padding:16px; }
  #card h2 { margin:0 0 2px; color:var(--navy); font-size:20px; }
  .tag { font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.08em; color:var(--orange); }
  .tag.later { color:var(--muted); }
  #card p { line-height:1.5; margin:10px 0; }
  .cmd { display:flex; gap:8px; align-items:center; }
  .cmd code { flex:1; background:var(--cream); border:1px solid var(--line); padding:10px 12px; border-radius:6px; font-size:14px; white-space:nowrap; overflow-x:auto; min-width:0; }
  .cmd button { font:600 14px Inter, sans-serif; background:var(--orange); color:#fff; border:0; border-radius:6px; padding:10px 14px; cursor:pointer; }
  small { color:var(--muted); }
  @media (max-width:480px){ nav { grid-template-columns:repeat(2,1fr); } }
</style>
</head>
<body>
<header>
  <div class="top"><div><b>VENTA</b> <span>CONSULTING</span></div>
    <div class="switch" role="group" aria-label="Which business"><button data-m="venta">Venta</button><button data-m="rts">RTS</button></div></div>
  <p id="sub"></p>
</header>
<div class="stage">
  <canvas id="scene" aria-hidden="true"></canvas>
  <div class="overlay"><small>Drag to look around · pinch or scroll to zoom</small><button id="overview">Whole office</button></div>
</div>
<nav id="tabs" aria-label="Agents"></nav>
<section id="card" aria-live="polite"></section>

<script type="importmap">{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/" } }</script>
<script type="module">
// Two offices in one. Each mode's agents map to the four department rooms, in order.
// Agent list mirrors CLAUDE.md. When an agent goes live, set live:true and add its commands.
const OUTREACH_NOTE = 'Paste into Claude Code in the venta-office folder, with Chrome open and signed in. It drafts everything, then waits for you to reply "send all".';
const MARKETING_NOTE = 'Paste into Claude Code in the venta-office folder. Plain /maria writes fresh group posts for Sergio; add anything else you want after it. Drafts only; María never posts.';
const MODES = {
  venta: { sub:'Venta office · nonprofit AI program', agents: [
    { who:'Jefe', name:'Chief of Staff', live:true, cmds:['/jefe'], note:'Paste into Claude Code in the venta-office folder. Plain /jefe is the morning brief. Or give him orders for the team: /jefe tell María to write group posts, have Sergio run Facebook and Olga update the dashboard.',
      role:'Your boss of the office: morning brief, plus he hands out work to María, Sergio and Olga in one go. Reads the pipeline sheet, calendar and Gmail. Reads the pipeline sheet, calendar and Gmail, and tells you what matters today.' },
    { who:'Sergio', name:'Sales', live:true, cmds:['/sergio venta'], note:OUTREACH_NOTE,
      role:'Finds local nonprofit leaders in Williamson County on LinkedIn, drafts connection notes, messages and replies, and offers the free 20-minute AI check.' },
    { who:'Olga', name:'Operations', live:true, cmds:['/olga'], note:'Paste into Claude Code in the venta-office folder. Best after each Sergio run or on Fridays. Your private dashboard link is in her summary.',
      role:'Learns what works from every run and your feedback, keeps your private dashboard current, tidies the Venta pipeline sheet and preps your discovery calls.' },
    { who:'María', name:'Marketing', live:true, cmds:['/maria venta'], note:MARKETING_NOTE,
      role:'LinkedIn posts for local nonprofit leaders, talk outlines and brand checks, using your Venta Google Drive folder.' } ] },
  rts: { sub:'RTS office · referral partners', agents: [
    { who:'Jefe', name:'Chief of Staff', live:false, role:'Not set up for RTS yet.' },
    { who:'Sergio', name:'Partner Outreach', live:true, cmds:['/sergio', '/sergio linkedin', '/sergio youtube', '/sergio tiktok'], note:OUTREACH_NOTE + ' Plain /sergio is the full Facebook routine: every DM, every unanswered comment, follow-ups, up to 10 group posts and 15 comments.',
      role:'Finds referral partners (dispatchers, trucking insurance agents, compliance services and more), answers messages and comments, follows up, and drafts group posts in English and Spanish.' },
    { who:'Olga', name:'Operations', live:true, cmds:['/olga learn'], note:'Paste into Claude Code in the venta-office folder. RTS stays top of the funnel; Salesforce handles the rest.',
      role:'Studies Sergio\'s RTS runs and your feedback: which groups, posts and wording get replies, and how to raise response rates and partner quality.' },
    { who:'María', name:'Marketing', live:true, cmds:['/maria', '/maria video script for TikTok'], note:MARKETING_NOTE,
      role:'Group posts for Sergio, flyer copy and short video scripts in English and Spanish, using your RTS Financial — Marketing Drive folder.' } ] },
};
let mode = 'venta', AGENTS = MODES.venta.agents;
try { mode = location.hash === '#rts' ? 'rts' : location.hash === '#venta' ? 'venta' : localStorage.getItem('mode') || 'venta'; } catch {}
if (!MODES[mode]) mode = 'venta';

const tabs = document.getElementById('tabs'), card = document.getElementById('card');
let show3D = () => {}, relabel3D = () => {}, overview = () => {};

function select(i, fly = true) {
  const a = AGENTS[i];
  [...tabs.children].forEach((b, j) => b.setAttribute('aria-pressed', j === i));
  card.innerHTML = `<div class="tag ${a.live ? '' : 'later'}">${a.live ? 'Live' : 'Coming soon'}</div>
    <h2>${a.who} · ${a.name}</h2><p>${a.role}</p>` + (a.live
    ? a.cmds.map(c => `<div class="cmd"><code>${c}</code><button>Copy</button></div>`).join('') + `<p><small>${a.note}</small></p>`
    : `<p><small>This agent isn't set up yet.</small></p>`);
  card.querySelectorAll('.cmd button').forEach(b => b.onclick = () =>
    navigator.clipboard.writeText(b.previousElementSibling.textContent).then(() => b.textContent = 'Copied', () => b.textContent = 'Select it'));
  show3D(i, fly);
}
function setMode(m) {
  mode = m; AGENTS = MODES[m].agents;
  try { localStorage.setItem('mode', m); history.replaceState(null, '', '#' + m); } catch {}
  document.getElementById('sub').textContent = MODES[m].sub + ' · tap a room or a person';
  document.querySelectorAll('.switch button').forEach(b => b.setAttribute('aria-pressed', b.dataset.m === m));
  tabs.innerHTML = '';
  AGENTS.forEach((a, i) => {
    const b = document.createElement('button');
    b.innerHTML = `${a.who}<br><small>${a.name}</small>`; if (!a.live) b.className = 'later';
    b.onclick = () => select(i); tabs.append(b);
  });
  relabel3D();
  select(AGENTS.findIndex(a => a.live), false);
}
document.querySelectorAll('.switch button').forEach(b => b.onclick = () => setMode(b.dataset.m));
document.getElementById('overview').onclick = () => overview();
setMode(mode); // the cards work even if the 3D below fails to load

// ---------- 3D office ----------
const THREE = await import('three');
const { OrbitControls } = await import('three/addons/controls/OrbitControls.js');
const { RoomEnvironment } = await import('three/addons/environments/RoomEnvironment.js');
await document.fonts.load('700 48px Inter').catch(() => {});

const V = (x, y, z) => new THREE.Vector3(x, y, z);
let seed = 7; const rnd = () => (seed = seed * 16807 % 2147483647) / 2147483647; // fixed seed: same office every load

const canvas = document.getElementById('scene');
const renderer = new THREE.WebGLRenderer({ canvas, antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
const scene = new THREE.Scene(); scene.background = new THREE.Color('#e6ecef'); scene.fog = new THREE.Fog('#e6ecef', 70, 160);
scene.environment = new THREE.PMREMGenerator(renderer).fromScene(new RoomEnvironment(), 0.04).texture;
const camera = new THREE.PerspectiveCamera(40, 1, 0.1, 200);
const controls = new OrbitControls(camera, canvas);
Object.assign(controls, { enableDamping:true, maxPolarAngle:1.3, minDistance:4, maxDistance:80 });

scene.add(new THREE.HemisphereLight('#ffffff', '#d8cfc2', .5));
const sun = new THREE.DirectionalLight('#fff6ea', 2.2); sun.position.set(9, 22, 14);
sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048); sun.shadow.normalBias = .03;
Object.assign(sun.shadow.camera, { left:-17, right:17, top:13, bottom:-13, far:60 });
scene.add(sun);

// --- building blocks ---
const mats = {};
const mat = (c, r = .8, m = 0) => mats[c + r + m] ||= new THREE.MeshStandardMaterial({ color:c, roughness:r, metalness:m });
const leafMat = new THREE.MeshStandardMaterial({ color:'#4d7a47', roughness:.8, flatShading:true });
const glassMat = new THREE.MeshStandardMaterial({ color:'#cfe3ee', roughness:.05, metalness:.2, transparent:true, opacity:.16, depthWrite:false });
const frostMat = new THREE.MeshStandardMaterial({ color:'#ffffff', transparent:true, opacity:.55, depthWrite:false });
const METAL = mat('#2b2f38', .4, .6), WALL = mat('#f3efe9', .9), WHITE = mat('#f4f2ee', .5), OAK = mat('#c9a77c', .6);

function mesh(p, geo, m, x = 0, y = 0, z = 0) {
  const o = new THREE.Mesh(geo, typeof m === 'string' ? mat(m) : m);
  o.position.set(x, y, z); o.castShadow = o.receiveShadow = !m.transparent; p.add(o); return o;
}
const B = (p, w, h, d, m, x, y, z) => mesh(p, new THREE.BoxGeometry(w, h, d), m, x, y, z);
const C = (p, rt, rb, h, m, x, y, z) => mesh(p, new THREE.CylinderGeometry(rt, rb, h, 20), m, x, y, z);
const S = (p, r, m, x, y, z) => mesh(p, new THREE.SphereGeometry(r, 20, 14), m, x, y, z);
function G(p, x = 0, z = 0, ry = 0) { const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = ry; p.add(g); return g; }
function limb(p, a, b, r, m) { // capsule from point a to point b
  const d = b.clone().sub(a), o = mesh(p, new THREE.CapsuleGeometry(r, d.length(), 4, 12), m);
  o.position.copy(a).addScaledVector(d, .5); o.quaternion.setFromUnitVectors(V(0, 1, 0), d.normalize()); return o;
}
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas'); c.width = w; c.height = h; draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 4; return t;
}
function floorTex(base, kind, w, d) {
  const t = canvasTex(512, 512, (x) => {
    x.fillStyle = base; x.fillRect(0, 0, 512, 512);
    if (kind === 'planks') for (let r = 0; r < 8; r++) for (let px = -rnd() * 200; px < 512;) {
      const len = 180 + rnd() * 220;
      x.fillStyle = rnd() < .5 ? `rgba(0,0,0,${rnd() * .07})` : `rgba(255,255,255,${rnd() * .08})`;
      x.fillRect(px, r * 64, len, 64); x.strokeStyle = 'rgba(0,0,0,.13)'; x.lineWidth = 2; x.strokeRect(px, r * 64, len, 64); px += len;
    } else for (let i = 0; i < 6000; i++) { x.fillStyle = `rgba(${rnd() < .5 ? '0,0,0' : '255,255,255'},.05)`; x.fillRect(rnd() * 512, rnd() * 512, 3, 3); }
  });
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(w / 2, d / 2); return t;
}
const brandTex = (w, h, tagline) => canvasTex(w, h, (x) => {
  x.fillStyle = '#13284E'; x.fillRect(0, 0, w, h); x.fillStyle = '#F26B21'; x.fillRect(0, h - 10, w, 10);
  x.textAlign = 'center'; x.font = `700 ${h * .2}px Inter`; x.fillStyle = '#fff'; x.fillText('VENTA', w / 2, h * .42);
  x.font = `600 ${h * .1}px Inter`; x.fillStyle = '#F58A4B'; x.fillText('C O N S U L T I N G', w / 2, h * .58);
  if (tagline) { x.font = `400 ${h * .065}px Inter`; x.fillStyle = '#d9dee8'; x.fillText('Connecting people, process and AI.', w / 2, h * .78); }
});
const screenOn = canvasTex(256, 150, (x) => {
  x.fillStyle = '#13284E'; x.fillRect(0, 0, 256, 150); x.fillStyle = '#F26B21'; x.fillRect(0, 0, 256, 16);
  x.fillStyle = '#d9dee8'; for (let i = 0; i < 5; i++) x.fillRect(14, 32 + i * 20, 70 + (i * 37) % 50, 7);
  x.fillStyle = '#F58A4B'; [40, 70, 55, 90, 75].forEach((h, i) => x.fillRect(150 + i * 19, 135 - h, 12, h));
});
const screenOff = canvasTex(64, 40, (x) => { const g = x.createLinearGradient(0, 0, 64, 40); g.addColorStop(0, '#1d2230'); g.addColorStop(1, '#0b0d12'); x.fillStyle = g; x.fillRect(0, 0, 64, 40); });
const labelTex = (name, status, live) => canvasTex(600, 170, (c, w, h) => {
    c.fillStyle = 'rgba(19,40,78,.94)'; c.beginPath(); c.roundRect(4, 4, w - 8, h - 8, 28); c.fill();
    if (live) { c.fillStyle = '#F26B21'; c.fillRect(40, h - 14, w - 80, 6); }
    c.textAlign = 'center'; c.fillStyle = '#fff'; c.font = '700 54px Inter'; c.fillText(name, w / 2, status ? 80 : 104);
    if (status) { c.font = '600 34px Inter'; c.fillStyle = live ? '#F58A4B' : '#b9c2d3'; c.fillText(status, w / 2, 130); }
});
function label(p, x, z, tex) {
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map:tex, depthTest:false }));
  s.position.set(x, 3.7, z); s.scale.set(3.2, .9, 1); s.renderOrder = 10; p.add(s); return s;
}

// --- furniture ---
function chair(p, x, z, ry = 0, fabric = '#3a4254') {
  const g = G(p, x, z, ry);
  B(g, .5, .08, .48, fabric, 0, .46, 0);
  B(g, .46, .55, .06, fabric, 0, .8, .25).rotation.x = .12;
  C(g, .03, .03, .32, METAL, 0, .28, 0);
  for (let k = 0; k < 5; k++) { const r = G(g, 0, 0, k * Math.PI * .4); B(r, .05, .04, .3, METAL, 0, .08, .15); S(r, .03, '#111', 0, .03, .29); }
  for (const s of [-1, 1]) { B(g, .05, .04, .28, '#1d1f24', s * .27, .63, .02); B(g, .04, .16, .04, '#1d1f24', s * .27, .55, .1); }
  return g;
}
function person(p, o) {
  const g = G(p), sk = mat(o.skin, .6), top = mat(o.top, .85), pa = mat(o.pants, .85), hr = mat(o.hair, .7);
  for (const s of [-1, 1]) {
    limb(g, V(.1 * s, .56, .02), V(.1 * s, .56, -.42), .075, pa);
    limb(g, V(.1 * s, .56, -.42), V(.1 * s, .1, -.46), .06, pa);
    B(g, .1, .07, .22, '#1f1f22', .1 * s, .035, -.5);
    limb(g, V(.2 * s, 1.04, .03), V(.25 * s, .82, -.1), .055, top);
    limb(g, V(.25 * s, .82, -.1), V(.14 * s, .79, -.38), .048, top);
    S(g, .045, sk, .14 * s, .79, -.41);
  }
  limb(g, V(-.1, .58, 0), V(.1, .58, 0), .1, pa);
  limb(g, V(0, .68, .04), V(0, .98, .03), .17, top).scale.set(1.2, 1, .72);
  C(g, .045, .05, .12, sk, 0, 1.14, .03);
  const head = new THREE.Group(); head.position.set(0, 1.3, .02); g.add(head);
  S(head, .115, sk, 0, 0, 0).scale.set(1, 1.12, 1.04);
  mesh(head, new THREE.SphereGeometry(.124, 20, 12, 0, Math.PI * 2, 0, Math.PI * .55), hr, 0, .015, .008).rotation.x = .35;
  if (o.hairStyle === 'long') B(head, .25, .3, .07, hr, 0, -.14, .07);
  if (o.hairStyle === 'bun') S(head, .06, hr, 0, .1, .1);
  return head;
}
function station(p, x, z, o, live) { // desk + chair + person, facing -z
  const g = G(p, x, z);
  B(g, 1.6, .04, .8, WHITE, 0, .74, -.7);
  for (const s of [-1, 1]) B(g, .05, .72, .7, METAL, s * .76, .36, -.7);
  B(g, 1.5, .3, .02, METAL, 0, .55, -1.06);
  B(g, .22, .015, .16, METAL, 0, .768, -.95); B(g, .04, .3, .03, METAL, 0, .92, -.97);
  B(g, .66, .4, .03, '#18191c', 0, 1.17, -.95);
  const screen = mesh(g, new THREE.PlaneGeometry(.62, .36), new THREE.MeshBasicMaterial({ map: screenOff }), 0, 1.17, -.934);
  B(g, .44, .02, .14, '#e9e9ea', 0, .77, -.44); B(g, .06, .02, .1, '#e9e9ea', .32, .77, -.44);
  C(g, .04, .04, .1, '#F26B21', -.55, .81, -.55);
  B(g, .2, .015, .28, '#13284E', .55, .768, -.62);
  C(g, .06, .05, .1, '#ffffff', -.62, .81, -.95); S(g, .09, leafMat, -.62, .92, -.95);
  chair(g, 0, .05);
  const ring = mesh(g, new THREE.RingGeometry(.9, 1.0, 48), new THREE.MeshBasicMaterial({ color:'#F26B21', transparent:true }), 0, .02, -.35);
  ring.rotation.x = -Math.PI / 2; ring.visible = false;
  return { ring, screen, head: person(g, o), live:false };
}
function plant(p, x, z, s = 1) {
  const g = G(p, x, z); g.scale.setScalar(s);
  C(g, .2, .15, .42, '#efebe4', 0, .21, 0);
  for (let k = 0; k < 6; k++) mesh(g, new THREE.IcosahedronGeometry(.26, 0), leafMat, (rnd() - .5) * .35, .7 + k * .12, (rnd() - .5) * .35);
}
function bookshelf(p, x, z, ry) {
  const g = G(p, x, z, ry), cols = ['#13284E', '#F26B21', '#EADFD1', '#5B6475', '#8a6d4b', '#2f5d50', '#ffffff'];
  B(g, 1.2, 1.9, .02, '#e8e2d8', 0, .95, -.17);
  for (const s of [-1, 1]) B(g, .03, 1.9, .35, OAK, s * .6, .95, 0);
  for (const y of [.02, .48, .95, 1.42, 1.88]) {
    B(g, 1.2, .03, .35, OAK, 0, y, 0);
    if (y < 1.8) for (let bx = -.56; bx < .5;) { const w = .03 + rnd() * .04, h = .24 + rnd() * .16; if (rnd() > .1) B(g, w, h, .24, cols[(rnd() * 7) | 0], bx + w / 2, y + .015 + h / 2, .02); bx += w + .006; }
  }
}
function sofa(p, x, z, ry, w, c) { // seat faces -z
  const g = G(p, x, z, ry);
  B(g, w, .25, .85, c, 0, .2, 0); B(g, w, .45, .2, c, 0, .6, .33);
  for (const s of [-1, 1]) B(g, .18, .55, .85, c, s * (w / 2 - .09), .3, 0);
  const n = Math.max(1, Math.round((w - .36) / .7)), cw = (w - .36) / n;
  for (let i = 0; i < n; i++) B(g, cw - .03, .13, .62, c, -w / 2 + .18 + cw * (i + .5), .39, -.06);
}
function table(p, x, z, w, d, h, top) {
  const g = G(p, x, z); B(g, w, .04, d, top, 0, h, 0);
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) B(g, .04, h, .04, METAL, sx * (w / 2 - .06), h / 2, sz * (d / 2 - .06));
}
const rug = (p, x, z, w, d, c) => { const r = B(p, w, .012, d, c, x, .007, z); r.castShadow = false; };

// --- walls: 'ext' window wall, 'glass' interior glass with doors, 'solid', 'curtain' all-glass ---
function wall(a, b, kind, doors = []) {
  const dx = b[0] - a[0], dz = b[1] - a[1], L = Math.hypot(dx, dz), g = G(scene, a[0], a[1], -Math.atan2(dz, dx));
  const cuts = [0, ...doors.flatMap(d => [d - .6, d + .6]), L];
  for (let i = 0; i < cuts.length; i += 2) {
    const s = cuts[i], e = cuts[i + 1], len = e - s, cx = (s + e) / 2;
    if (kind === 'solid') B(g, len, 2.9, .12, WALL, cx, 1.45, 0);
    if (kind === 'ext') {
      B(g, len, .9, .14, WALL, cx, .45, 0); B(g, len, .4, .14, WALL, cx, 2.7, 0); B(g, len, 1.6, .02, glassMat, cx, 1.7, 0);
      for (let t = s; t <= e; t += 1.6) B(g, .05, 1.6, .07, METAL, t, 1.7, 0);
    }
    if (kind === 'glass' || kind === 'curtain') {
      B(g, len, 2.9, .02, glassMat, cx, 1.45, 0);
      B(g, len, .05, .06, METAL, cx, .025, 0); B(g, len, .08, .08, METAL, cx, 2.86, 0);
      for (const t of kind === 'glass' ? [s, e] : Array.from({ length: Math.round(len / 2) + 1 }, (_, k) => s + k * len / Math.round(len / 2))) B(g, .06, 2.9, .08, METAL, t, 1.45, 0);
      if (kind === 'glass') B(g, len, .12, .025, frostMat, cx, 1.25, 0);
    }
  }
}

// --- floor plan: corridor along x, three rooms north and three south ---
const W = 13, D = 9, CZ = 1.6, RX = W / 3;
const ground = B(scene, 400, .02, 400, '#d5dccf', 0, -.03, 0); ground.castShadow = false;
B(scene, 2 * W + 3, .02, 2 * D + 3, '#e4e0d8', 0, -.015, 0).castShadow = false;
const corridor = B(scene, 2 * W, .02, 2 * CZ, new THREE.MeshStandardMaterial({ map: floorTex('#cfcdc8', 'noise', 2 * W, 2 * CZ), roughness:.35 }), 0, 0, 0);
corridor.castShadow = false;

const ROOMS = [
  { name:'Chief of Staff', agent:0, cx:-2 * RX, cz:-(D + CZ) / 2 },
  { name:'Sales', agent:1, cx:0, cz:-(D + CZ) / 2 },
  { name:'Operations', agent:2, cx:2 * RX, cz:-(D + CZ) / 2 },
  { name:'Marketing', agent:3, cx:-2 * RX, cz:(D + CZ) / 2 },
  { name:'Conference room', cx:0, cz:(D + CZ) / 2, floor:'#4a5266' },
  { name:'Lounge', cx:2 * RX, cz:(D + CZ) / 2, floor:'#a88560' },
];
const rd = D - CZ, stations = [];
for (const r of ROOMS) {
  r.g = G(scene); r.g.userData.room = r;
  const f = B(r.g, 2 * RX, .02, rd, new THREE.MeshStandardMaterial({ map: floorTex(r.floor || '#d8bf98', r.floor === '#4a5266' ? 'noise' : 'planks', 2 * RX, rd), roughness:.7 }), r.cx, .005, r.cz);
  f.castShadow = false;
  if (r.agent === undefined) label(r.g, r.cx, r.cz, labelTex(r.name));
  else r.sprite = label(r.g, r.cx, r.cz, screenOff); // texture set by relabel3D
}
const [cos, sales, ops, mkt, conf, lounge] = ROOMS.map(r => r.g);
const nz = -(D + CZ) / 2, sz = (D + CZ) / 2;

// Chief of Staff
rug(cos, -2 * RX, nz + .2, 3.2, 2.4, '#EADFD1');
stations[0] = station(cos, -2 * RX, nz + .6, { skin:'#8d5a3b', hair:'#1b1b1b', top:'#13284E', pants:'#2b2f38' }, true);
bookshelf(cos, -W + .25, nz - .5, Math.PI / 2); bookshelf(cos, -W + .25, nz + 1, Math.PI / 2);
sofa(cos, -2 * RX + 2.6, nz + 1.7, -Math.PI / 2, .95, '#EADFD1');
plant(cos, -W + .6, -D + .6); plant(cos, -RX - .5, -D + .6, .8);
// Sales
stations[1] = station(sales, -.8, nz + .6, { skin:'#e0b896', hair:'#6b3e1f', top:'#3f6f8f', pants:'#cbbfa8' });
const wb = G(sales, RX - .1, nz - .4, -Math.PI / 2);
B(wb, 1.8, 1.0, .03, '#fafafa', 0, 1.5, 0); B(wb, 1.84, .04, .08, METAL, 0, .99, .02);
[['#F26B21', .5, 1.75], ['#13284E', .9, 1.55], ['#13284E', .6, 1.4], ['#F58A4B', 1.1, 1.25]].forEach(([c, w, y]) => B(wb, w, .03, .01, c, -.8 + w / 2, y, .02));
table(sales, 2.2, nz + 1.6, 1, 1, .74, OAK); chair(sales, 2.2, nz + 2.3); chair(sales, 2.2, nz + .9, Math.PI);
plant(sales, -RX + .6, -D + .6); plant(sales, RX - .6, -D + .6, .9);
// Operations
stations[2] = station(ops, 2 * RX - .8, nz + .6, { skin:'#c68a5e', hair:'#2a1a10', hairStyle:'bun', top:'#f2f2f2', pants:'#1D2433' });
for (let i = 0; i < 3; i++) { const c = G(ops, W - .4, nz - 1.8 + i * .5, -Math.PI / 2); B(c, .46, 1.05, .6, '#9aa1ad', 0, .525, 0); for (const y of [.3, .6, .9]) B(c, .3, .03, .01, METAL, 0, y, .3); }
bookshelf(ops, W - .25, nz + 1.4, -Math.PI / 2);
plant(ops, RX + .6, -D + .6); plant(ops, W - .6, -CZ - .7, .8);
// Marketing (video studio)
stations[3] = station(mkt, -W + 2.3, sz - .6, { skin:'#f1cfb1', hair:'#d9b26a', hairStyle:'long', top:'#6b8f5e', pants:'#3a3f4b' });
const bd = G(mkt, -RX - 2, D - .5); B(bd, 2.4, 2.2, .04, '#13284E', 0, 1.2, 0); for (const s of [-1, 1]) B(bd, .04, 2.4, .04, METAL, s * 1.22, 1.2, 0);
C(mkt, .17, .17, .04, OAK, -RX - 2, .66, D - 1.4); C(mkt, .02, .02, .64, METAL, -RX - 2, .32, D - 1.4);
const tp = G(mkt, -RX - 2, sz - .6, Math.PI);
for (let k = 0; k < 3; k++) { const an = k * 2.1; limb(tp, V(0, 1.15, 0), V(Math.sin(an) * .35, 0, Math.cos(an) * .35), .012, METAL); }
B(tp, .2, .14, .26, '#16171a', 0, 1.25, 0); C(tp, .05, .05, .1, '#16171a', 0, 1.25, -.17).rotation.x = Math.PI / 2;
C(mkt, .015, .015, 1.5, METAL, -RX - 1.2, .75, sz - .2);
mesh(mkt, new THREE.TorusGeometry(.25, .025, 8, 40), new THREE.MeshStandardMaterial({ color:'#fff', emissive:'#fff', emissiveIntensity:1.5 }), -RX - 1.2, 1.6, sz - .2).rotation.y = .4;
plant(mkt, -W + .6, D - .6);
// Conference room
const ct = G(conf, 0, sz); B(ct, 4.4, .05, 1.3, mat('#8a6a4a', .5), 0, .74, 0); for (const s of [-1, 1]) B(ct, .12, .7, .7, METAL, s * 1.4, .36, 0);
for (const x of [-1.65, -.55, .55, 1.65]) { chair(conf, x, sz - 1.0, Math.PI, '#EADFD1'); chair(conf, x, sz + 1.0, 0, '#EADFD1'); }
chair(conf, -2.6, sz, -Math.PI / 2, '#EADFD1'); chair(conf, 2.6, sz, Math.PI / 2, '#EADFD1');
const tv = G(conf, -RX + .12, sz, Math.PI / 2); B(tv, 2.0, 1.15, .05, '#111', 0, 1.55, 0);
mesh(tv, new THREE.PlaneGeometry(1.92, 1.07), new THREE.MeshBasicMaterial({ map: brandTex(512, 286, true) }), 0, 1.55, .03);
plant(conf, RX - .6, D - .6); plant(conf, RX - .6, CZ + .7, .8);
// Lounge
rug(lounge, 2 * RX - .3, sz + .5, 3.4, 2.6, '#EADFD1');
sofa(lounge, 2 * RX - .3, D - .7, 0, 2.4, '#5B6475');
sofa(lounge, 2 * RX - 2.2, sz + .4, -Math.PI / 2, .95, '#F58A4B');
table(lounge, 2 * RX - .3, sz + .4, 1.2, .6, .42, OAK);
B(lounge, .6, .9, 4, WHITE, W - .4, .45, sz); B(lounge, .64, .04, 4.04, '#2b2f38', W - .4, .92, sz);
B(lounge, .3, .4, .3, '#1d1d1f', W - .4, 1.14, sz - 1.2); C(lounge, .04, .04, .1, '#ffffff', W - .4, .99, sz - .7);
plant(lounge, RX + .6, D - .6); plant(lounge, W - .6, CZ + .6, .8);
// Walkway: reception, sign, plants
const sign = G(scene, -W + .1, 0, Math.PI / 2); B(sign, 2.2, 1.1, .05, '#13284E', 0, 1.7, 0);
mesh(sign, new THREE.PlaneGeometry(2.1, 1.05), new THREE.MeshBasicMaterial({ map: brandTex(512, 256) }), 0, 1.7, .03);
B(scene, .6, 1.05, 1.8, WHITE, -W + 1.8, .52, 0); B(scene, .7, .04, 1.9, OAK, -W + 1.8, 1.07, 0);
for (const x of [-RX, RX, W - .7]) for (const z of [-CZ + .5, CZ - .5]) plant(scene, x, z, .75);

wall([-W, -D], [W, -D], 'ext'); wall([-W, -D], [-W, D], 'ext'); wall([W, -D], [W, D], 'ext');
wall([-W, D], [W, D], 'curtain');
wall([-W, -CZ], [W, -CZ], 'glass', [RX, 3 * RX, 5 * RX]); wall([-W, CZ], [W, CZ], 'glass', [RX, 3 * RX, 5 * RX]);
for (const x of [-RX, RX]) { wall([x, -D], [x, -CZ], 'solid'); wall([x, CZ], [x, D], 'solid'); }

// --- camera, picking, selection ---
let fly = null, moved = false;
const flyTo = (x, z, far) => {
  const a = camera.aspect, portrait = a < 1;
  // portrait phones look along the building's long side so it fits the narrow screen
  const off = far ? (portrait ? V(22, 21, 0).multiplyScalar(Math.max(1, .95 / a)) : V(0, 20, 22).multiplyScalar(Math.max(1, 1.35 / a)))
                  : V(0, 7, 7.5).multiplyScalar(Math.max(1, 1.2 / a));
  fly = { t: V(x, 0, z), p: V(x, 0, z).add(off) };
};
overview = () => flyTo(0, 0, true);
controls.addEventListener('start', () => { fly = null; moved = true; });
show3D = (i, go) => {
  stations.forEach((s, j) => s.ring.visible = i === j);
  const r = ROOMS.find(r => r.agent === i); if (go) { moved = true; flyTo(r.cx, r.cz); }
};
relabel3D = () => ROOMS.forEach(r => {
  if (r.agent === undefined) return;
  const a = AGENTS[r.agent], s = stations[r.agent];
  const st = a.name + (a.live ? ' · Live' : ' · Coming soon');
  if (r.sprite.material.map !== screenOff) r.sprite.material.map.dispose();
  r.sprite.material.map = labelTex(a.who, st, a.live);
  s.screen.material.map = a.live ? screenOn : screenOff; s.live = a.live;
});
relabel3D(); show3D(AGENTS.findIndex(a => a.live), false);

function resize() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); // changes when the window moves between screens
  renderer.setSize(w, h, false); camera.aspect = w / h; camera.updateProjectionMatrix();
  if (!moved) { overview(); camera.position.copy(fly.p); controls.target.copy(fly.t); fly = null; } // re-frame until the user takes over
}
addEventListener('resize', resize); resize();

const ray = new THREE.Raycaster(), pt = new THREE.Vector2(), groups = ROOMS.map(r => r.g);
function pick(e) {
  const b = canvas.getBoundingClientRect();
  pt.set((e.clientX - b.left) / b.width * 2 - 1, -(e.clientY - b.top) / b.height * 2 + 1);
  ray.setFromCamera(pt, camera);
  let o = ray.intersectObjects(groups, true)[0]?.object;
  while (o && !o.userData.room) o = o.parent;
  return o?.userData.room;
}
let down;
canvas.addEventListener('pointerdown', e => down = [e.clientX, e.clientY]);
canvas.addEventListener('pointerup', e => {
  if (!down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return; // was a drag, not a tap
  const r = pick(e); if (!r) return;
  r.agent !== undefined ? select(r.agent) : flyTo(r.cx, r.cz);
});
canvas.addEventListener('pointermove', e => { if (e.pointerType === 'mouse') canvas.style.cursor = pick(e) ? 'pointer' : 'grab'; });

renderer.setAnimationLoop(t => {
  if (fly) { controls.target.lerp(fly.t, .08); camera.position.lerp(fly.p, .08); if (camera.position.distanceTo(fly.p) < .05) fly = null; }
  stations.forEach((s, i) => {
    s.head.rotation.y = Math.sin(t / 1400 + i * 2) * .25;
    if (s.ring.visible) s.ring.material.opacity = .55 + Math.sin(t / 300) * .35;
    if (s.live) s.head.position.y = 1.3 + Math.sin(t / 350) * .012;
  });
  controls.update(); renderer.render(scene, camera);
});
</script>
